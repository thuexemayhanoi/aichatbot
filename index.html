<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MotoAI — Trợ lý thuê xe máy Hà Nội</title>
  <meta name="description" content="MotoAI — trợ lý tự động trả lời giá thuê xe máy, đặt cọc, giao xe, giờ mở cửa của Thuê Xe Máy Hà Nội Nguyễn Tú.">
  <link rel="canonical" href="https://thuexemayhanoi.github.io/aichatbot/">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply theme before first paint to avoid a flash.
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var theme = (params.get('theme') || 'auto').toLowerCase();
        var dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.motoaiTheme = dark ? 'dark' : 'light';
      } catch (e) { /* default to light */ }
    })();
  </script>
</head>
<body>
  <main class="motoai-app" id="motoai-app">
    <header class="motoai-header">
      <div class="motoai-header-text">
        <h1 class="motoai-title">MotoAI</h1>
        <p class="motoai-subtitle" id="motoai-subtitle">Trợ lý thuê xe máy Hà Nội Nguyễn Tú</p>
      </div>
      <span class="motoai-status" id="motoai-status" role="status"></span>
    </header>

    <section class="motoai-messages" id="motoai-messages" aria-live="polite" aria-label="Tin nhắn"></section>

    <div class="motoai-quick" id="motoai-quick" role="group" aria-label="Câu hỏi nhanh"></div>

    <div class="motoai-ai-panel" id="motoai-ai-panel">
      <button type="button" class="motoai-ai-toggle" id="motoai-ai-toggle" hidden>
        ⚡ Bật AI tại chỗ (Local AI)
      </button>
      <div class="motoai-ai-status" id="motoai-ai-status" hidden>
        <div class="motoai-ai-progress"><div class="motoai-ai-progress-bar" id="motoai-ai-progress-bar"></div></div>
        <span id="motoai-ai-status-text"></span>
        <button type="button" class="motoai-ai-off" id="motoai-ai-off" hidden>Tắt</button>
      </div>
    </div>

    <form class="motoai-composer" id="motoai-composer">
      <input class="motoai-input" id="motoai-input" type="text" name="message"
             placeholder="Nhập câu hỏi của bạn..." autocomplete="off"
             enterkeyhint="send" maxlength="2000" aria-label="Câu hỏi">
      <button class="motoai-send" type="submit" aria-label="Gửi">Gửi</button>
    </form>

    <p class="motoai-disclosure" id="motoai-disclosure">
      Trợ lý trả lời tự động dựa trên dữ liệu có sẵn. Không gửi dữ liệu đi đâu — AI (nếu bật) chạy ngay trên máy bạn.
    </p>
  </main>

  <noscript>MotoAI cần JavaScript để hoạt động. Vui lòng gọi 0942 467 674 để được hỗ trợ.</noscript>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
