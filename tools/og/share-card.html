<!DOCTYPE html>
<!-- Source for assets/images/og/motoai-share.png (1200×630), rendered by tools/og-share-card.mjs.
     Brand mark, colours and font are the site's own (assets/css, assets/fonts); no photo, no AI image. -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: BVP; font-weight: 400; src: url(../../assets/fonts/bvp-400.woff2) format('woff2'); }
  @font-face { font-family: BVP; font-weight: 600; src: url(../../assets/fonts/bvp-600.woff2) format('woff2'); }
  @font-face { font-family: BVP; font-weight: 800; src: url(../../assets/fonts/bvp-800.woff2) format('woff2'); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f5f5f7; color: #1d1d1f; font-family: BVP, sans-serif; overflow: hidden; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 84px 96px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand svg { width: 132px; height: 132px; }
  .tile { fill: #1d1d1f; } .road { fill: none; stroke: #f5f5f7; stroke-width: 2.2; stroke-linecap: round; }
  .lane { fill: none; stroke: #0071e3; stroke-width: 2.4; stroke-linecap: round; }
  .name { font-size: 104px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
  h1 { margin: 0; font-size: 54px; font-weight: 800; line-height: 1.12; letter-spacing: -1px; max-width: 980px; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 600; color: #6e6e73; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #0071e3; margin-right: 14px; vertical-align: middle; }
  .chip { color: #fff; background: #0071e3; border-radius: 999px; padding: 14px 30px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="tile" width="32" height="32" rx="9"/><path class="road" d="M7.5 26.5 14 5.5M24.5 26.5 18 5.5"/><path class="lane" d="M16 25.5v-3.6M16 18.6v-2.8M16 12.9V11"/></svg>
      <span class="name">MotoAI</span>
    </div>
    <h1>Trợ lý và cẩm nang thuê xe máy,<br>xe điện tại Hà Nội</h1>
    <div class="foot"><span><span class="dot"></span>chatbot.thuexemaynguyentu.com</span><span class="chip">Hỏi Agent</span></div>
  </div>
</body>
</html>
