name: ops-owner-review

# One-shot owner shim (precedent: ops-owner-lock-release.yml and the
# owner-initiated second-line review of INC-20261006160640-4vj8).
# The owner pushes a request file; this shim runs with proper permissions.
# Actions:
#   supervisor        -> gh workflow run ops-supervisor.yml (same incident_id)
#   factory-requeue   -> gh workflow run blog-factory-publish.yml with article_ids
#   resolve-incident  -> owner manual-resolution checklist for a FAILED_MANUAL
#                        incident: fix the recorded infra cause, prove the repo
#                        healthy (validators + targeted tests), then release the
#                        maintenance lock ref. Never touches article content.
#   dry-run           -> dispatch auto-writer.yml -f dry_run=true: AI generation
#                        + full QA for the next chunk, NOTHING pushed/published.
#                        Safe connectivity check for GitHub Models inference.
#   pause             -> owner STOP of the AUTO FACTORY: set
#                        production_enabled=false in
#                        docs/state/operations/maintenance.json and commit. The
#                        switch is durable: every auto-writer run goes IDLE at
#                        its ops gate and the watchdog never wakes production.
#                        Published articles, queue and matrix stay untouched.
#   resume            -> owner RESUME: set production_enabled=true, commit, and
#                        dispatch auto-writer.yml so the first cycle starts
#                        immediately instead of waiting for the cron.

on:
  push:
    branches: [main]
    paths:
      - 'ops/owner-review/**'

permissions:
  contents: write
  actions: write
  # Owner-requested rebuild of the already validated current Pages source.
  pages: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'Read the owner request and dispatch'
        run: |
          set -euo pipefail
          mkdir -p ops/out
          LOG="$RUNNER_TEMP/owner-review-shim.log"
          {
            echo "=== owner-review shim $(date -u +%FT%TZ) run ${GITHUB_RUN_ID:-local} ==="
            echo "--- gh version ---"
            gh --version
            echo "--- workflow list --all ---"
            gh workflow list --all
            echo "--- request.json ---"
            cat ops/owner-review/request.json 2>&1
            echo "--- dispatch ---"
            ACTION=$(node -e "console.log(require('./ops/owner-review/request.json').action || 'supervisor')")
            echo "action: $ACTION"
            case "$ACTION" in
              supervisor)
                ID=$(node -e "console.log(require('./ops/owner-review/request.json').incident_id)")
                BASE=$(node -e "console.log(require('./ops/owner-review/request.json').base_sha || '')")
                ARGS=(-f incident_id="$ID")
                if [ -n "$BASE" ]; then ARGS+=(-f base_sha="$BASE"); fi
                for KEY in verification_sha dry_run_id smoke_run_id; do
                  VALUE=$(node -e 'console.log(require("./ops/owner-review/request.json")[process.argv[1]] || "")' "$KEY")
                  if [ -n "$VALUE" ]; then ARGS+=(-f "$KEY=$VALUE"); fi
                done
                gh workflow run ops-supervisor.yml --ref main "${ARGS[@]}"
                echo "DISPATCH_EXIT=$?"
                ;;
              factory-requeue)
                IDS=$(node -e "console.log(require('./ops/owner-review/request.json').article_ids)")
                gh workflow run blog-factory-publish.yml --ref main -f article_ids="$IDS"
                echo "DISPATCH_EXIT=$?"
                ;;
              resolve-incident)
                ID=$(node -e "console.log(require('./ops/owner-review/request.json').incident_id)")
                FIX=$(node -e "console.log(require('./ops/owner-review/request.json').fix || 'none')")
                echo "owner manual resolution of $ID"
                echo "--- fix: $FIX ---"
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                if [ "$FIX" = "remove-stale-writer-work" ] && [ -d writer-work ]; then
                  git rm -r -q writer-work
                  git commit -m "ops: remove stale writer-work left on main by the pre-v70 manual flow (owner fix for $ID) [skip ci]" || echo "nothing to remove"
                  for i in 1 2 3; do
                    if git pull --rebase origin main && git push; then break; fi
                    sleep 5
                  done
                else
                  echo "(no repo fix requested or nothing to remove)"
                fi
                echo "--- writer-queue validate ---"
                node tools/writer-queue.mjs validate; WQ=$?
                echo "--- blog-factory validate ---"
                node tools/blog-factory.mjs validate; BF=$?
                echo "--- targeted tests ---"
                timeout 300 node --test tests/unit/writer-queue.test.js tests/unit/writer-queue-requeue.test.js tests/unit/blog-factory.test.js tests/unit/article-qa.test.js tests/unit/ops-agents.test.js > /tmp/tests.tap 2>&1
                TE=$?
                grep -E '^# (tests|pass|fail) ' /tmp/tests.tap || echo "(no tap summary)"
                grep -E '^not ok' /tmp/tests.tap || echo "(no failing tests)"
                if [ "$WQ" -ne 0 ] || [ "$BF" -ne 0 ] || [ "$TE" -ne 0 ]; then
                  echo "VALIDATION FAILED (wq=$WQ bf=$BF tests=$TE) — REFUSING to release the lock"
                  echo "RESOLVE_EXIT=1"
                  exit 1
                else
                  echo "validators + targeted tests green — releasing the maintenance lock"
                  git push origin --delete "refs/ops/maintenance-lock/$ID" && echo "LOCK_RELEASED" || echo "LOCK_RELEASE_FAILED"
                  echo "--- remaining lock refs ---"
                  git ls-remote --refs origin "refs/ops/maintenance-lock/*" || echo "(no lock refs)"
                  echo "RESOLVE_EXIT=0"
                fi
                ;;
              noop)
                echo "review controls updated; no production action requested"
                ;;
              pages-test)
                node tools/writer-queue.mjs validate
                node tools/blog-factory.mjs validate
                node tools/site-audit.mjs
                node tools/factory-pages.mjs
                echo "DISPATCH_EXIT=0"
                ;;
              smoke-test)
                MODEL=$(node -e "console.log(require('./ops/owner-review/request.json').model || 'qwen3:4b-instruct-2507-q4_K_M')")
                gh workflow run auto-writer.yml --ref main -f smoke_only=true -f dry_run=true -f model="$MODEL"
                echo "DISPATCH_EXIT=0"
                ;;
              dry-run)
                echo "owner-requested AUTO FACTORY dry run (AI generation + QA, nothing pushed)"
                MODEL=$(node -e "console.log(require('./ops/owner-review/request.json').model || 'qwen3:4b-instruct-2507-q4_K_M')")
                ATTEMPTS=$(node -e "console.log(require('./ops/owner-review/request.json').max_attempts || '2')")
                gh workflow run auto-writer.yml --ref main -f dry_run=true -f model="$MODEL" -f max_attempts="$ATTEMPTS"
                echo "DISPATCH_EXIT=$?"
                ;;
              pause)
                echo "owner STOP of the AUTO FACTORY (durable owner switch)"
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                jq '.production_enabled = false' docs/state/operations/maintenance.json > /tmp/maint.tmp && mv /tmp/maint.tmp docs/state/operations/maintenance.json
                git add docs/state/operations/maintenance.json
                git commit -m "ops: owner STOP — AUTO FACTORY paused, queue untouched [skip ci]" || echo "already paused"
                for i in 1 2 3; do
                  if git pull --rebase origin main && git push; then break; fi
                  sleep 5
                done
                echo "production_enabled=false committed — scheduled auto-writer runs now go IDLE at the ops gate"
                echo "DISPATCH_EXIT=0"
                ;;
              resume)
                echo "owner RESUME of the AUTO FACTORY"
                INCIDENT=$(jq -r '.active_incident.incident_id // empty' docs/state/operations/maintenance.json)
                LOCKS=$(git ls-remote --refs origin 'refs/ops/maintenance-lock/*')
                if [ -n "$INCIDENT" ] || [ -n "$LOCKS" ]; then
                  echo '::error::cannot RESUME with an active incident or maintenance lock'
                  exit 1
                fi
                node tools/writer-queue.mjs validate
                node tools/blog-factory.mjs validate
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                jq '.production_enabled = true' docs/state/operations/maintenance.json > /tmp/maint.tmp && mv /tmp/maint.tmp docs/state/operations/maintenance.json
                git add docs/state/operations/maintenance.json
                git commit -m "ops: owner RESUME — AUTO FACTORY enabled [skip ci]" || echo "already enabled"
                PUSHED=false
                for i in 1 2 3; do
                  if git pull --rebase origin main && git push; then PUSHED=true; break; fi
                  sleep 5
                done
                [ "$PUSHED" = "true" ] || { echo '::error::RESUME state commit failed'; exit 1; }
                gh workflow run auto-writer.yml --ref main -f dry_run=false
                echo "DISPATCH_EXIT=$?"
                ;;
              *)
                echo "UNKNOWN ACTION: $ACTION"
                echo "DISPATCH_EXIT=2"
                exit 2
                ;;
            esac
            echo "=== end ==="
          } 2>&1 | tee "$LOG"
      - name: 'Preserve the owner request log'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-request-${{ github.run_id }}
          path: ${{ runner.temp }}/owner-review-shim.log
          if-no-files-found: error
