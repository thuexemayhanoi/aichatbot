name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full test suite (unit + integration + golden + regression)
        run: node --test
      - name: Secret scan (no keys, no tokens)
        run: |
          if grep -rInE "(api[_-]?key|secret|token)[\"' ]*[:=][\"' ]*[A-Za-z0-9+/]{16,}" src assets embed.js index.html data integrations service-worker.js manifest.webmanifest tools; then
            echo "::error::Possible secret found"; exit 1
          fi
      - name: Inference endpoint scan (v45 distribution surface)
        run: |
          if grep -rInE "api\.(openai|anthropic|mistral)\.com|generativelanguage\.googleapis\.com|api\.(groq|deepseek|together)\.(com|xyz)" src assets integrations service-worker.js manifest.webmanifest tools embed.js index.html; then
            echo "::error::Remote inference endpoint found"; exit 1
          fi
      - name: Bundle regression guard (fail if base JS grows past 196KB)
        run: |
          size=$(find src assets -name '*.js' -print0 | xargs -0 cat | wc -c)
          size2=$(wc -c < embed.js)
          total=$((size + size2))
          echo "base JS bytes: $total (baseline 2026-09-26 v46: 192000)"
          # v46 adds the 12-action quick bar (suggestions.js chip kinds +
          # main.js renderer for query/link/agent chips). Embed stays tiny.
          test "$total" -lt 196000
