name: CI

# Article-only production pushes (writer cycle: article body + manifest
# draft) are handled by blog-factory-publish.yml with scoped QA and must NOT
# pay for the full chatbot suite, PWA icon generation or WordPress ZIP
# builds on every article. Engine/tool/workflow/test changes — anything
# outside the article production surface below — still run FULL CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/blog/articles/**'
      - 'data/blog/published.json'
      - 'data/blog/content-matrix.csv'
      - 'blog/**'
      - 'sitemap.xml'
      - 'reports/**'
      - 'docs/state/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full test suite (unit + integration + golden + regression)
        run: node --test
      - name: Secret scan (no keys, no tokens)
        run: |
          if grep -rInE "(api[_-]?key|secret|token)[\"' ]*[:=][\"' ]*[A-Za-z0-9+/]{16,}" src assets embed.js index.html data blog config tools docs service-worker.js manifest.webmanifest integrations; then
            echo "::error::Possible secret found"; exit 1
          fi
      - name: Inference endpoint scan (v45+ distribution surface)
        run: |
          if grep -rInE "api\.(openai|anthropic|mistral)\.com|generativelanguage\.googleapis\.com|api\.(groq|deepseek|together)\.(com|xyz)" src assets integrations service-worker.js manifest.webmanifest tools embed.js index.html; then
            echo "::error::Remote inference endpoint found"; exit 1
          fi
      - name: Bundle regression guard (fail if base JS grows past 225KB)
        run: |
          size=$(find src assets -name '*.js' -print0 | xargs -0 cat | wc -c)
          size2=$(wc -c < embed.js)
          total=$((size + size2))
          echo "base JS bytes: $total (baseline 2026-09-26 v47: 200000)"
          # v47 adds the blog shell: assets/js/blog.js (lazy blog search) and
          # menu-drawer wiring in main.js. Blog HTML is static, not counted.
          # v58 bumps the guard 220KB -> 222KB: blog search gains category
          # filter + clear + result count, and the chat homepage gains the
          # Auto/Sáng/Tối theme toggle (initTheme wiring in main.js).
          # v61 bumps 223KB -> 225KB: app-shell.js gains the parent-hub
          # dropdown touch/keyboard toggle (hover-only menus are inaccessible
          # on tablets). v60 previously added the tiny scroll diagnostic.
          test "$total" -lt 225000
