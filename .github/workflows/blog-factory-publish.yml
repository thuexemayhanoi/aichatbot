name: Blog Factory Publish (2-article micro batch)
run-name: 'Factory ${{ inputs.article_ids || ''backlog'' }} request ${{ inputs.request_id || github.run_id }}'

# v67 SIMPLE PRODUCTION MODE (docs/CONTINUOUS-WRITER.md, mirrors /vanchinh):
#
#   select exact push ids -> recover ONLY if a real txn marker exists
#   -> prepare-chunk (auto-claim the exact ids) -> scoped QA of the exact ids
#   -> ONE grouped transactional publish (ONE build for the whole chunk)
#   -> light matrix smoke -> ONE derived-state commit -> assert clean.
#
# No persistent workflow lock: runs are serialized by the concurrency group
# below; crash safety lives in the txn marker (resume) and backlog discovery.
# The final step explicitly requests and verifies Pages for the derived SHA.
# GITHUB_TOKEN pushes alone do not trigger a Pages build.
#
# Scope rules (tools/factory-select.mjs) — NEW / REPAIR / BACKLOG are
# mutually exclusive:
#   new     : pushed bodies on PLANNED/WRITING rows — claim EXACTLY those;
#             pushed repair rows in the same push ride along in scoped QA;
#             unrelated pending/backlog rows are never mixed in.
#   repair  : pushed QA/REPAIR/PASS rows — re-QA exactly those;
#             NEVER claims fresh PLANNED rows.
#   backlog : only when no article bodies were pushed (workflow_dispatch
#             without ids) — unfinished rows with a valid draft first, then
#             PLANNED rows whose body + draft already exist.
#
# Refuse: >50 bodies, unknown slug, duplicate ids/paths, missing manifest
# draft, pushed run state, FAIL/BLOCKED rows, published.json without a body.
# PUBLISHED rows are never rewritten automatically (skip, manual rebuild).
#
# Per-article pushes run SCOPED verification only — the full node --test
# suite, full-site SEO audit and distribution builds stay in ci.yml (engine/
# tool/workflow changes) and the final 2000-article audit. The derived commit
# never touches the trigger paths and is marked [skip ci], so publishing
# cannot loop this workflow.

on:
  push:
    branches: [main]
    paths: ['data/blog/articles/**', 'data/blog/published.json']
  workflow_dispatch:
    inputs:
      article_ids:
        description: 'BA-ids chính xác, phân cách phẩy (vd BA-0002,BA-0003). Bỏ trống để quét backlog/pending.'
        required: false
        default: ''
      request_id:
        description: 'Correlation ID supplied by the serialized publisher'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-factory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # v70 ops gate: the factory mutates production derived state — it must
      # refuse while an ops incident is active (the deterministic resume of a
      # recorded transaction is run by Agent #4 itself, not by this workflow).
      - name: 'Ops maintenance gate (incident/lock -> production paused)'
        run: |
          LOCKS=$(git ls-remote --refs origin 'refs/ops/maintenance-lock/*')
          if [ -n "$LOCKS" ]; then
            echo "::error::maintenance lock active — production paused"; exit 1
          fi
          node tools/ops-agent.mjs gate

      - name: Select exact push scope (claim/qa/ready ids from the push diff)
        id: select
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.article_ids }}" ]; then
            node tools/factory-select.mjs --ids "${{ github.event.inputs.article_ids }}" | tee /tmp/select.out
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/factory-select.mjs --backlog | tee /tmp/select.out
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD > /tmp/changed.txt || true
            node tools/factory-select.mjs --files /tmp/changed.txt | tee /tmp/select.out
          fi
          get() { sed -n "s/^$1=//p" /tmp/select.out; }
          {
            echo "proceed=$(get proceed)"
            echo "mode=$(get mode)"
            echo "ids=$(get ids)"
            echo "claim_ids=$(get claim_ids)"
            echo "qa_ids=$(get qa_ids)"
            echo "ready_ids=$(get ready_ids)"
          } >> "$GITHUB_OUTPUT"
          echo "selected: mode=$(get mode) claim=[$(get claim_ids)] qa=[$(get qa_ids)] ready=[$(get ready_ids)]"

      - name: Recover pending transaction (only if a real txn marker exists)
        if: steps.select.outputs.proceed == 'true'
        run: |
          if [ -f docs/state/blog-factory.transaction.json ]; then
            echo "pending transaction marker — resuming the EXACT ids before any new work"
            node tools/blog-factory.mjs resume
          else
            echo "clean state — straight to production"
          fi
          rm -f docs/state/blog-factory.lock # retired: runs are serialized by the concurrency group
          test ! -f docs/state/blog-factory.transaction.json \
            || { echo "::error::transaction marker still present after resume"; exit 1; }

      - name: Prepare chunk (auto-claim the exact pushed ids — PLANNED -> QA)
        if: steps.select.outputs.proceed == 'true' && steps.select.outputs.claim_ids != ''
        run: node tools/blog-factory.mjs prepare-chunk ${{ steps.select.outputs.claim_ids }}

      - name: Minimal QA chunk (score >= 70 -> PASS; independent result per article)
        if: steps.select.outputs.proceed == 'true' && steps.select.outputs.qa_ids != ''
        run: |
          node tools/blog-factory.mjs qa-chunk ${{ steps.select.outputs.qa_ids }} | tee /tmp/qa.out
          echo "PASS_IDS=$(sed -n 's/^pass_ids=//p' /tmp/qa.out)" >> "$GITHUB_ENV"
          echo "FAIL_IDS=$(sed -n 's/^fail_ids=//p' /tmp/qa.out)" >> "$GITHUB_ENV"

      - name: Grouped transactional publish (PASS + ready ids; ONE build for the chunk)
        if: steps.select.outputs.proceed == 'true'
        run: |
          PUBLISH_IDS="$(echo "$PASS_IDS${PASS_IDS:+,}${{ steps.select.outputs.ready_ids }}" | sed 's/,,*/,/g; s/^,//; s/,$//')"
          if [ -n "$PUBLISH_IDS" ]; then
            node tools/blog-factory.mjs publish-chunk "$PUBLISH_IDS"
          else
            echo "no PASS rows — nothing to publish (REPAIR rows stay in the repair queue)"
          fi

      - name: Light matrix smoke (rows, distribution, uniqueness)
        if: steps.select.outputs.proceed == 'true'
        run: node tools/blog-factory.mjs validate

      - name: Verify custom-domain output before publishing derived state
        if: steps.select.outputs.proceed == 'true'
        run: node tools/site-audit.mjs

      - name: Commit derived state (one commit per chunk)
        if: steps.select.outputs.proceed == 'true'
        run: |
          git config user.name "motoai-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add data/blog/content-matrix.csv data/blog/knowledge-index.json \
            blog sitemap.xml robots.txt reports/blog-factory-run.md
          if [ -f docs/state/blog-factory.checkpoint.json ]; then
            git add docs/state/blog-factory.checkpoint.json
          fi
          # Never stage the writer source (article bodies, manifest) or run
          # state — the derived commit cannot re-trigger this workflow.
          if git diff --cached --quiet; then
            echo "no derived changes to commit"
          else
            git commit -m "factory: publish [${{ steps.select.outputs.ids }}] ${{ steps.select.outputs.mode }} chunk (2-article micro batch) [skip ci]"
            for ATTEMPT in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo '::error::derived-state conflict — retain the failed run for recovery'
                exit 1
              fi
              sleep 5
            done
            echo '::error::could not commit derived state after three attempts'
            exit 1
          fi

      - name: Assert clean state; report QA failures
        if: steps.select.outputs.proceed == 'true'
        run: |
          test ! -f docs/state/blog-factory.transaction.json || { echo "::error::txn marker left behind"; exit 1; }
          test ! -f docs/state/blog-factory.lock || { echo "::error::lock left behind"; exit 1; }
          if [ -n "$FAIL_IDS" ]; then
            echo "::error::QA failures recorded (rows stay in REPAIR for repair): $FAIL_IDS"
            exit 1
          fi

      - name: 'Request and verify Pages for the publication commit'
        # A crash after the derived commit can leave all ids PUBLISHED but
        # the deployment unfinished. Selection skips those old articles;
        # deployment verification must still run for their explicit requeue.
        if: steps.select.outputs.proceed == 'true' || inputs.article_ids != ''
        timeout-minutes: 12
        run: |
          node tools/site-audit.mjs
          node tools/factory-pages.mjs
