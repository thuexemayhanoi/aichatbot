name: Blog Factory Publish (1 article / cycle)

# v65 CONTINUOUS-READY publish pipeline (docs/CONTINUOUS-WRITER.md).
# Deterministic, NO AI, NO API keys, NO secrets inside Actions. Exactly ONE
# article per run. GitHub owns the state transitions so the writer's happy
# path is just: write 1 article source + its manifest draft entry -> push.
#
#   detect exact ID (tools/factory-select.mjs)
#   -> RECOVER first (resume any pending transaction, clear stale lock)
#   -> lock -> prepare (auto-claim: PLANNED -> WRITING -> QA, no-op on QA/PASS)
#   -> scoped QA (deterministic PASS/FAIL)
#   -> publish transaction (build + verify) -> matrix smoke
#   -> clean txn/lock -> commit derived state (single commit)
#
# Triggers:
#   - push to main under data/blog/articles/** or data/blog/published.json
#     (the writer's cycle commit: article body + manifest draft entry;
#     the matrix is NOT part of a writer push anymore — the workflow owns it)
#   - workflow_dispatch with an explicit BA-id (manual path)
#
# This workflow intentionally does NOT run the full chatbot test suite:
# article-only production runs scoped QA + light matrix smoke. The full
# node --test suite stays in ci.yml (which itself skips article-only pushes
# via paths-ignore) and covers engine/tool/workflow changes.
#
# The derived-state commit never touches the trigger paths (data/blog/articles,
# data/blog/published.json) and GITHUB_TOKEN pushes never re-trigger
# workflows, so publishing cannot loop this workflow.
#
# Refuse rules (tools/factory-select.mjs):
#   - a push touching more than one article body -> REFUSE (1 article/cycle)
#   - a body without a matching manifest draft entry -> REFUSE
#   - duplicate article_id in the manifest -> REFUSE
#   - a draft for ANOTHER unfinished article pending -> REFUSE (resume first)
#   - unknown slug / pushed run state -> REFUSE
#   - PUBLISHED-row edits -> SKIP (manual rebuild, never auto-rewritten)

on:
  push:
    branches: [main]
    paths: ['data/blog/articles/**', 'data/blog/published.json']
  workflow_dispatch:
    inputs:
      article_id:
        description: 'BA-id chính xác (vd BA-0002). Bỏ trống để tự detect từ lần push gần nhất.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: blog-factory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect exact article (exactly 1 per cycle)
        id: detect
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.article_id }}" ]; then
            node tools/factory-select.mjs --id "${{ github.event.inputs.article_id }}" | tee /tmp/select.out
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD > /tmp/changed.txt || true
            node tools/factory-select.mjs --files /tmp/changed.txt | tee /tmp/select.out
          fi
          id=$(sed -n 's/^id=//p' /tmp/select.out)
          mode=$(sed -n 's/^mode=//p' /tmp/select.out)
          claim=$(sed -n 's/^claim=//p' /tmp/select.out)
          qa=$(sed -n 's/^qa=//p' /tmp/select.out)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "claim=${claim:-no}" >> "$GITHUB_OUTPUT"
          echo "qa=${qa:-no}" >> "$GITHUB_OUTPUT"
          echo "detected: mode=$mode id=$id claim=${claim:-no} qa=${qa:-no}"

      - name: Recover first — resume pending transaction, clear stale lock
        if: steps.detect.outputs.mode == 'publish'
        run: |
          if [ -f docs/state/blog-factory.transaction.json ]; then
            echo "pending transaction found — resuming BEFORE any new article"
            node tools/blog-factory.mjs resume
          fi
          if [ -f docs/state/blog-factory.lock ]; then
            echo "stale lock found (runs are serialized; locks are never committed) — removing"
            node tools/blog-factory.mjs unlock
          fi
          test ! -f docs/state/blog-factory.transaction.json \
            || { echo "::error::transaction marker still present after resume"; exit 1; }

      - name: Lock the cycle (single writer)
        if: steps.detect.outputs.mode == 'publish'
        run: node tools/blog-factory.mjs lock

      - name: Prepare — auto-claim the exact article (PLANNED -> QA)
        if: steps.detect.outputs.mode == 'publish' && steps.detect.outputs.claim == 'yes'
        run: node tools/blog-factory.mjs prepare ${{ steps.detect.outputs.id }}

      - name: Scoped QA (deterministic PASS/FAIL for the exact 1 article)
        if: steps.detect.outputs.mode == 'publish' && steps.detect.outputs.qa == 'yes'
        run: node tools/blog-factory.mjs qa ${{ steps.detect.outputs.id }}

      - name: Publish transaction (build + verify consistency)
        if: steps.detect.outputs.mode == 'publish'
        run: node tools/blog-factory.mjs publish ${{ steps.detect.outputs.id }}

      - name: Matrix smoke (rows, distribution, uniqueness)
        if: steps.detect.outputs.mode == 'publish'
        run: node tools/blog-factory.mjs validate

      - name: Clean lock + assert no transaction marker
        if: steps.detect.outputs.mode == 'publish'
        run: |
          node tools/blog-factory.mjs unlock
          test ! -f docs/state/blog-factory.transaction.json \
            || { echo "::error::transaction marker still present"; exit 1; }

      - name: Commit derived state (single commit; lock/txn never committed)
        if: steps.detect.outputs.mode == 'publish'
        run: |
          git config user.name "motoai-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add data/blog/content-matrix.csv data/blog/knowledge-index.json \
            blog sitemap.xml robots.txt reports/blog-factory-run.md
          if [ -f docs/state/blog-factory.checkpoint.json ]; then
            git add docs/state/blog-factory.checkpoint.json
          fi
          git reset -q -- docs/state/blog-factory.lock docs/state/blog-factory.transaction.json 2>/dev/null || true
          # Never stage the writer source (article body files or the
          # manifest) — the push that triggered this run stays untouched
          # and the derived commit cannot re-trigger this workflow.
          if git diff --cached --quiet; then
            echo "no derived changes to commit"
          else
            git commit -m "factory: publish ${{ steps.detect.outputs.id }} (1 article/cycle) [skip ci]"
            git push
          fi
