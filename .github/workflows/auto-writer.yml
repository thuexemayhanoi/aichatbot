name: 'Auto Writer (AI article generation)'

# v71 AUTO FACTORY (docs/AUTO-WRITER.md).
#
# Owner directive 2026-10-08: production must run 24/7 WITHOUT any external
# chat session. This workflow IS the writer: each run handles EXACTLY ONE
# 2-article chunk (never a loop inside a job) and then exits:
#
#   1. ops gate — refuse cleanly (idle, NOT red) while the owner switch is
#      off or an incident/lock is active; otherwise ops-agent gate;
#   2. tools/auto-writer.mjs run — pick the lowest-seq RESERVED chunk of the
#      ACTIVE batch, generate both articles with local Ollama inference,
#      run the FULL production QA in a sandbox root, bounded regenerate on
#      QA failure (default 4 attempts, local Qwen model);
#   3. READY_TO_PUSH -> writer-queue begin/ready (the ONLY state writers),
#      push the writer branch (2 bodies + chunk file), then dispatch the
#      writer-publisher explicitly (a GITHUB_TOKEN push triggers nothing);
#   4. NEED_BATCH -> dispatch the writer-coordinator (reserve next 18),
#      exit 0 — the next scheduled run picks the new batch up;
#   5. FAILED -> exit 1 (red): ops-repair-agent #4 opens an incident, the
#      maintenance lock pauses all production until the owner RESUMEs
#      (mandatory stop rule 7). Inference failures carry a clear reason.
#
# Schedule every 25 minutes + concurrency group auto-writer (serialized,
# never cancelled mid-run) make the cycle safe against double-writer races:
# the chunk states (RESERVED -> READY_TO_PUSH) are idempotent and a crashed
# run always leaves the chunk RESERVED for the next run to retry safely.

on:
  schedule:
    # Lightweight heartbeat of the AUTO FACTORY: one chunk per run, max.
    - cron: '*/25 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = sinh bài + QA nhưng KHÔNG begin/ready/push/publish'
        required: false
        default: 'false'
      model:
        description: 'Ollama model (mặc định qwen3:4b-instruct); chỉ mô hình local'
        required: false
        default: ''
      max_attempts:
        description: 'Số lần sinh lại tối đa mỗi bài khi QA fail'
        required: false
        default: '2'

permissions:
  # contents: write — push the writer branch writer/<batch>/<A|B|C> only.
  # NEVER pushes main (writer-publisher is the only component that does).
  contents: write
  # actions: write — dispatch writer-coordinator / writer-publisher
  # explicitly (a GITHUB_TOKEN push cannot trigger workflows).
  actions: write

concurrency:
  # Two scheduled runs never generate in parallel; the second waits, then
  # observes the progressed queue. A run is never cancelled mid-generation.
  group: auto-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      AUTO_WRITER_MODEL: ${{ inputs.model || 'qwen3:4b-instruct' }}
      AUTO_WRITER_URL: http://127.0.0.1:11434/api/chat
      AUTO_WRITER_TIMEOUT_MS: '1200000'
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '16384'
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_FLASH_ATTENTION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # the writer branch view + ops refs need it

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ----------------------------------------------------------------
      # Ops gate. Owner STOP (production_enabled=false) or an active
      # incident/maintenance lock makes the factory IDLE, not RED: the run
      # exits 0 so no failure event fires while production is deliberately
      # paused. The durable owner switch + lock refs ARE the stop state —
      # the schedule can never wake production past this gate.
      # ----------------------------------------------------------------
      - name: 'Ops gate (owner stop / incident lock -> idle, not failed)'
        id: gate
        run: |
          set -e
          PROD_ENABLED=$(jq -r '.production_enabled // false' docs/state/operations/maintenance.json)
          LOCKS=$(git ls-remote --refs origin 'refs/ops/maintenance-lock/*' || true)
          if [ "$PROD_ENABLED" != "true" ]; then
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "owner stop (production_enabled=false) — auto writer idle, queue untouched"
            exit 0
          fi
          if [ -n "$LOCKS" ]; then
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "maintenance lock active — auto writer idle, waiting for owner RESUME"
            exit 0
          fi
          node tools/ops-agent.mjs gate
          echo "open=true" >> "$GITHUB_OUTPUT"

      - name: 'Inspect queue before loading the model (resume staged chunks)'
        id: inspect
        if: steps.gate.outputs.open == 'true'
        run: |
          set -eo pipefail
          node tools/auto-writer.mjs inspect | tee /tmp/inspect.out
          sed -n 's/^status=/status=/p' /tmp/inspect.out >> "$GITHUB_OUTPUT"

      - name: 'Cache local writer model'
        if: steps.gate.outputs.open == 'true' && steps.inspect.outputs.status == 'GENERATE'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/writer-models
            ${{ runner.temp }}/ollama
          key: local-writer-v1-ollama-0.40.1-${{ runner.os }}-${{ env.AUTO_WRITER_MODEL }}

      - name: 'Start local Ollama and load the writer model (no API key)'
        if: steps.gate.outputs.open == 'true' && steps.inspect.outputs.status == 'GENERATE'
        timeout-minutes: 20
        run: |
          set -eo pipefail
          if [ ! -x "$RUNNER_TEMP/ollama/bin/ollama" ]; then
            ARCHIVE="$RUNNER_TEMP/ollama.tar.zst"
            curl --fail --show-error --location --retry 3 \
              https://github.com/ollama/ollama/releases/download/v0.40.1/ollama-linux-amd64.tar.zst \
              --output "$ARCHIVE"
            echo "a7aebbe3dd76ccf1351a56a3e57218ad4863cb5f9a9938c58de87a37555e355d  $ARCHIVE" | sha256sum --check
            mkdir -p "$RUNNER_TEMP/ollama"
            tar --zstd -xf "$ARCHIVE" -C "$RUNNER_TEMP/ollama"
          fi
          export OLLAMA_MODELS="$RUNNER_TEMP/writer-models"
          export PATH="$RUNNER_TEMP/ollama/bin:$PATH"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/version > /tmp/ollama-version.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/version
          ollama pull "$AUTO_WRITER_MODEL"
          ollama show "$AUTO_WRITER_MODEL"

      # ----------------------------------------------------------------
      # Generate exactly one chunk (AI + full production QA, bounded retry)
      # ----------------------------------------------------------------
      - name: 'Generate the next chunk (AI writer + sandboxed production QA)'
        id: gen
        if: steps.gate.outputs.open == 'true' && steps.inspect.outputs.status == 'GENERATE'
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '2' }}
        run: |
          set -o pipefail
          ARGS=(run)
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          ARGS+=(--max-attempts "$MAX_ATTEMPTS")
          # The runner shell is bash -e: a failed generation pipeline must NOT
          # abort the step before the key=value outputs are captured — the
          # FAILED branch below dispatches Agent #4 based on status=FAILED.
          set +e
          node tools/auto-writer.mjs "${ARGS[@]}" 2>&1 | tee /tmp/auto-writer.out
          GEN_RC=${PIPESTATUS[0]}
          set -e
          get() { sed -n "s/^$1=//p" /tmp/auto-writer.out | tail -1; }
          {
            echo "status=$(get status)"
            echo "batch=$(get batch)"
            echo "seq=$(get seq)"
            echo "writer=$(get writer)"
            echo "ids=$(get ids)"
            echo "branch=$(get branch)"
            echo "drafts=$(get drafts)"
          } >> "$GITHUB_OUTPUT"
          echo "generation result: status=$(get status) batch=$(get batch)#$(get seq) ids=$(get ids)"
          exit "$GEN_RC"

      # ----------------------------------------------------------------
      # NEED_BATCH: reserve the next 18 PLANNED rows, exit 0. The next
      # scheduled run (<= 25 min) picks the fresh ACTIVE batch up.
      # ----------------------------------------------------------------
      - name: 'No ACTIVE chunk — reserve the next batch'
        if: steps.gate.outputs.open == 'true' && steps.inspect.outputs.status == 'NEED_BATCH' && github.event.inputs.dry_run != 'true'
        run: |
          set -e
          gh workflow run writer-coordinator.yml --ref main -f dry_run=false -f limit=18
          echo "writer-coordinator dispatched (dry_run=false, limit=18) — next scheduled run writes the new batch"

      # ----------------------------------------------------------------
      # READY_TO_PUSH: begin/ready (writer-queue.mjs is the ONLY state
      # writer), push the writer branch, dispatch the publisher. A dry run
      # stops here: content is validated, nothing is pushed/published.
      # ----------------------------------------------------------------
      - name: 'Mark the chunk READY_TO_PUSH (writer-queue begin/ready)'
        id: ready
        if: steps.gate.outputs.open == 'true' && steps.gen.outputs.status == 'READY_TO_PUSH' && github.event.inputs.dry_run != 'true'
        run: |
          set -o pipefail
          node tools/writer-queue.mjs begin "${{ steps.gen.outputs.writer }}" "${{ steps.gen.outputs.batch }}" "${{ steps.gen.outputs.seq }}" | tee /tmp/begin.out
          node tools/writer-queue.mjs ready "${{ steps.gen.outputs.writer }}" "${{ steps.gen.outputs.batch }}" "${{ steps.gen.outputs.seq }}" --drafts "${{ steps.gen.outputs.drafts }}" | tee /tmp/ready.out
          get() { sed -n "s/^$1=//p" /tmp/ready.out | tail -1; }
          {
            echo "push_files=$(get push_files)"
            echo "branch=$(get branch)"
          } >> "$GITHUB_OUTPUT"
          echo "chunk READY_TO_PUSH — push_files=$(get push_files)"

      - name: 'Push the writer branch (2 bodies + chunk file)'
        if: steps.gate.outputs.open == 'true' && steps.gen.outputs.status == 'READY_TO_PUSH' && github.event.inputs.dry_run != 'true'
        env:
          BRANCH: ${{ steps.gen.outputs.branch }}
          PUSH_FILES: ${{ steps.ready.outputs.push_files }}
        run: |
          set -e
          git config user.name "motoai-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          # ready emits push_files comma-separated (writer-queue contract) —
          # split it into a plain whitespace list for the shell loops below.
          PUSH_FILES="${PUSH_FILES//,/ }"
          export PUSH_FILES
          # Stage the generated files outside the tree first: the writer
          # branch may already carry earlier chunk files (same path spaces).
          STASH=/tmp/auto-writer-staged
          rm -rf "$STASH" && mkdir -p "$STASH"
          for f in $PUSH_FILES; do
            mkdir -p "$STASH/$(dirname "$f")"
            cp "$f" "$STASH/$f"
          done
          git fetch --prune origin
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH" origin/main
          fi
          for f in $PUSH_FILES; do
            mkdir -p "$(dirname "$f")"
            cp "$STASH/$f" "$f"
          done
          git add $PUSH_FILES
          if git diff --cached --quiet; then
            echo "writer branch already carries this chunk — republish path"
          else
            git commit -m "writer ${{ steps.gen.outputs.batch }}#${{ steps.gen.outputs.seq }}: ${{ steps.gen.outputs.ids }} (auto-writer AI draft, QA PASS) [skip ci]"
          fi
          git push origin "$BRANCH"

      - name: 'Dispatch the writer-publisher (GITHUB_TOKEN push triggers nothing)'
        if: steps.gate.outputs.open == 'true' && (steps.gen.outputs.status == 'READY_TO_PUSH' || steps.inspect.outputs.status == 'READY_EXISTING') && github.event.inputs.dry_run != 'true'
        run: |
          set -e
          gh workflow run writer-publisher.yml --ref main -f action=auto
          echo "writer-publisher dispatched (action=auto) — it stages the chunk on main and drives blog-factory-publish"

      # ----------------------------------------------------------------
      # Terminal states. FAILED exits red -> Agent #4 incident -> lock ->
      # PAUSED until the owner RESUMEs (mandatory stop rule 7).
      # ----------------------------------------------------------------
      - name: 'Dry run stop (validated, nothing pushed)'
        if: steps.gate.outputs.open == 'true' && steps.gen.outputs.status == 'READY_TO_PUSH' && github.event.inputs.dry_run == 'true'
        run: |
          echo "dry run: chunk validated (batch ${{ steps.gen.outputs.batch }}#${{ steps.gen.outputs.seq }}, ids ${{ steps.gen.outputs.ids }}) — nothing pushed, nothing published"

      - name: 'Fail closed on generation failure'
        if: failure() && steps.gate.outputs.open == 'true' && steps.gen.outputs.status == 'FAILED'
        run: |
          echo "::error::auto-writer FAILED — see the generation log above. Chunk stays RESERVED; Agent #4 will classify the failure."
          # A GITHUB_TOKEN-dispatched run cannot fire the workflow_run watcher,
          # so the failure is handed to Agent #4 explicitly (publisher precedent).
          if gh workflow run ops-repair-agent.yml --ref main \
            -f source_workflow='Auto Writer (AI article generation)' \
            -f source_run_id="$GITHUB_RUN_ID" \
            -f source_url="https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
            -f reason="auto-writer generation failed (chunk ${{ steps.gen.outputs.batch }}#${{ steps.gen.outputs.seq }}, ids ${{ steps.gen.outputs.ids }})" \
            -f trigger="auto-writer FAILED (explicit dispatch)"; then
            echo "ops-repair-agent dispatched"
          else
            echo "::warning::ops-repair-agent dispatch failed — the red run above still records the failure"
          fi
          exit 1

      - name: 'Guard: unknown generation status'
        if: success() && steps.inspect.outputs.status == 'GENERATE' && steps.gen.outputs.status != 'READY_TO_PUSH'
        run: |
          echo "::error::unknown auto-writer status '${{ steps.gen.outputs.status }}'"
          exit 1

      - name: 'Report non-generation failures to Agent #4 (begin/ready/push/dispatch infra)'
        if: failure() && steps.gate.outputs.open == 'true' && steps.gen.outputs.status != 'FAILED'
        run: |
          # Any failure outside the generation step is infrastructure: a
          # GITHUB_TOKEN-dispatched run cannot fire the workflow_run watcher,
          # so hand it to Agent #4 explicitly (rule 7: red -> incident -> lock).
          if gh workflow run ops-repair-agent.yml --ref main \
            -f source_workflow='Auto Writer (AI article generation)' \
            -f source_run_id="$GITHUB_RUN_ID" \
            -f source_url="https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
            -f reason="auto-writer run failed outside the generation step (chunk ${{ steps.gen.outputs.batch }}#${{ steps.gen.outputs.seq }})" \
            -f trigger="auto-writer infra failure (explicit dispatch)"; then
            echo "ops-repair-agent dispatched"
          else
            echo "::warning::ops-repair-agent dispatch failed — the red run above still records the failure"
          fi
