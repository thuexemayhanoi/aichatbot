name: 'Writer Coordinator (central reservation)'

# v68 PARALLEL WRITER MODE (docs/PARALLEL-WRITER.md).
#
# The ONLY component allowed to claim article ids. It reserves at most 18
# PLANNED ids of a fresh matrix (v69 cycle: 12-18 articles) into ONE
# deterministic batch, splits them into 2-article micro chunks and assigns
# them round-robin to writer_A/B/C. The
# committed manifest (docs/state/writer-assignments.json) is the single
# source of truth; writers never pick "next PLANNED" themselves.
#
# Guards (tools/writer-queue.mjs plan):
#   - an ACTIVE batch is never re-reserved (crash/resume keeps the manifest);
#   - duplicate article ids anywhere in the batch FAIL CLOSED;
#   - rows with an existing draft or body (pending/repair/backlog) are never
#     mixed into a NEW batch (v67 SIMPLE PRODUCTION MODE stays untouched);
#   - v69 AUTO-REFILL: when planned < 100 the queue is refilled to ~300
#     valid topics BEFORE planning (gen-blog-matrix --refill appends rows,
#     never rewrites existing ones);
#   - the manifest write is an atomic exclusive create, so two racing
#     coordinators can never both reserve.
#
# dry_run=true (the default) plans and prints WITHOUT writing anything.
# The manifest commit never touches article paths, so it cannot trigger the
# factory workflow; [skip ci] keeps ci.yml quiet too.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'So bai moi cycle (12-18, toi da 18)'
        required: false
        default: '18'
      dry_run:
        description: 'true = chi in ke hoach, khong ghi manifest'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: writer-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # v70 ops gate: refuse to reserve/refill while an ops incident is
      # active (MAINTENANCE_LOCK && PRODUCTION_MUTATION = IMPOSSIBLE).
      # The refill mutates the matrix, so the gate must run BEFORE it.
      - name: 'Ops maintenance gate (incident/lock -> production paused)'
        run: |
          LOCKS=$(git ls-remote --refs origin 'refs/ops/maintenance-lock/*')
          if [ -n "$LOCKS" ]; then
            echo "::error::maintenance lock active — production paused"; exit 1
          fi
          node tools/ops-agent.mjs gate

      - name: 'Auto-refill the topic queue (planned < 100 -> ~300)'
        if: github.event.inputs.dry_run == 'false'
        run: |
          node tools/gen-blog-matrix.mjs --refill

      - name: 'Plan the next writer batch (central reservation)'
        id: plan
        run: |
          LIMIT="${{ github.event.inputs.limit || '18' }}"
          DRY="${{ github.event.inputs.dry_run || 'true' }}"
          EXTRA=""
          if [ "$DRY" != "false" ]; then EXTRA="--dry-run"; fi
          node tools/writer-queue.mjs plan --limit "$LIMIT" $EXTRA --base-sha "${{ github.sha }}" | tee /tmp/plan.out
          get() { sed -n "s/^$1=//p" /tmp/plan.out; }
          {
            echo "created=$(get created)"
            echo "batch_id=$(get batch_id)"
          } >> "$GITHUB_OUTPUT"
          echo "plan: created=$(get created) batch=$(get batch_id) total=$(get total)"

      - name: 'Commit the assignment manifest (single source of truth)'
        if: steps.plan.outputs.created == 'true'
        run: |
          git config user.name "motoai-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add docs/state/writer-assignments.json data/blog/content-matrix.csv
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "writer-coordinator: reserve batch ${{ steps.plan.outputs.batch_id }} (3-writer assignment manifest) [skip ci]"
            for ATTEMPT in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then exit 1; fi
              sleep 5
            done
            echo '::error::reservation commit could not be pushed'
            exit 1
          fi

      - name: 'Start one writer job for the newly reserved batch'
        if: steps.plan.outputs.created == 'true' && inputs.dry_run != 'true'
        run: |
          set -e
          git fetch origin main
          git checkout -B main origin/main
          LOCKS=$(git ls-remote --refs origin 'refs/ops/maintenance-lock/*')
          if [ -n "$LOCKS" ] || ! node tools/ops-agent.mjs gate; then exit 0; fi
          gh workflow run auto-writer.yml --ref main -f dry_run=false
