name: ops-qa-runner

# One-shot ops helper (precedent: ops-owner-lock-release.yml).
# Triggered by pushes of ops/candidate/** or this file to main. Mode is
# selected by ops/candidate/request.txt line 1:
# - "plan [N]"      -> coordinator fallback: writer-queue plan, commit assignments.
# - "verify-infra"  -> run the Agent #5 independent verification checks only.
# - "reconcile"     -> writer-queue reconcile (sync factory-failed chunks).
# - "grep"          -> diagnostic: grep a pattern (line 3) in file paths (line 2, |-separated).
# - default         -> matrix regex; state dump; if bodies + chunk.json are
#                      present, run the full local QA pipeline.
# Always commits ops/qa-result.txt with if: always().

on:
  push:
    branches: [main]
    paths:
      - 'ops/candidate/**'
      - '.github/workflows/ops-qa-runner.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump state, dispatch mode
        id: dump
        run: |
          mkdir -p ops/out
          MODE=qa
          REQ="^BA-029[7-9],|^BA-030[0-6],"
          if [ -f ops/candidate/request.txt ]; then
            LINE=$(head -1 ops/candidate/request.txt)
            if [ -n "$LINE" ]; then REQ="$LINE"; fi
            case "$LINE" in
              plan*) MODE=plan ;;
              verify-infra*) MODE=verify-infra ;;
              reconcile*) MODE=reconcile ;;
              grep*) MODE=grep ;;
            esac
          fi
          {
            echo "=== request ==="
            cat ops/candidate/request.txt 2>/dev/null || echo "(no request)"
            echo "=== mode ==="
            echo "$MODE"
            echo "=== matrix rows ==="
            grep -E "$REQ" data/blog/content-matrix.csv || echo "(no matrix rows)"
            echo "=== hub app ==="; ls blog/app 2>/dev/null
            echo "=== hub thue-xe ==="; ls blog/thue-xe 2>/dev/null
            echo "=== hub xe-dien ==="; ls blog/xe-dien 2>/dev/null
            echo "=== hub an-toan ==="; ls blog/an-toan 2>/dev/null
            echo "=== hub dia-phuong ==="; ls blog/dia-phuong 2>/dev/null
            echo "=== hub huong-dan ==="; ls blog/huong-dan 2>/dev/null
            echo "=== published count ==="
            node -e "const p=require('./data/blog/published.json');console.log(p.articles.length)"
            echo "=== active batch ==="
            node -e "const a=require('./docs/state/writer-assignments.json');console.log(a.active.batch_id, a.active.status, a.active.chunks.map(c=>c.seq+':'+c.status).join(' '))"
            if [ "$MODE" = "plan" ]; then
              echo "=== PLAN MODE ==="
              PLIMIT=$(head -1 ops/candidate/request.txt | grep -oE '[0-9]+' || true)
              PLIMIT=${PLIMIT:-18}
              node tools/writer-queue.mjs plan --limit "$PLIMIT" --base-sha "$(git rev-parse HEAD)" || echo "PLAN_FAILED"
              cp docs/state/writer-assignments.json ops/out/assignments-next.json
            fi
            if [ "$MODE" = "verify-infra" ]; then
              echo "=== VERIFY-INFRA MODE ==="
              : > ops/out/verify-verdict.txt
              echo "--- writer-queue usage (bare invocation) ---"
              node tools/writer-queue.mjs 2>&1 || true
              echo "--- writer-queue validate ---"
              node tools/writer-queue.mjs validate 2>&1; WQ=$?
              echo "EXIT=$WQ"
              echo "writer-queue-validate-exit=$WQ" >> ops/out/verify-verdict.txt
              echo "--- blog-factory validate ---"
              node tools/blog-factory.mjs validate 2>&1; BF=$?
              echo "EXIT=$BF"
              echo "blog-factory-validate-exit=$BF" >> ops/out/verify-verdict.txt
              echo "--- markers ---"
              if [ -f docs/state/blog-factory.transaction.json ]; then echo "TRANSACTION_MARKER_PRESENT"; echo "transaction-marker=yes" >> ops/out/verify-verdict.txt; else echo "no transaction marker"; echo "transaction-marker=no" >> ops/out/verify-verdict.txt; fi
              if [ -f docs/state/blog-factory.lock ]; then echo "RETIRED_LOCKFILE_PRESENT"; echo "retired-lockfile=yes" >> ops/out/verify-verdict.txt; else echo "no retired lockfile"; echo "retired-lockfile=no" >> ops/out/verify-verdict.txt; fi
              echo "--- maintenance lock refs ---"
              git ls-remote --refs origin "refs/ops/maintenance-lock/*" || echo "(ls-remote failed)"
              echo "--- state JSON parse ---"
              for F in docs/state/writer-assignments.json docs/state/active-work.json docs/state/blog-factory.checkpoint.json; do
                if [ -f "$F" ]; then
                  node -e "JSON.parse(require('fs').readFileSync('$F','utf8'))" && echo "OK $F" || echo "PARSE_FAIL $F"
                else
                  echo "MISSING $F"
                fi
              done
              echo "--- targeted tests (summary + failures only) ---"
              timeout 300 node --test tests/unit/writer-queue.test.js tests/unit/writer-queue-requeue.test.js tests/unit/blog-factory.test.js tests/unit/article-qa.test.js tests/unit/ops-agents.test.js > /tmp/tests.tap 2>&1
              TE=$?
              echo "TESTS_EXIT=$TE"
              grep -E '^# (tests|pass|fail|suites|cancelled|skipped) ' /tmp/tests.tap || echo "(no tap summary)"
              echo "--- failing tests (if any, with detail) ---"
              grep -E -A40 '^not ok' /tmp/tests.tap || echo "(none)"
              echo "--- writer-queue plan --dry-run output (test 135 subject) ---"
              node tools/writer-queue.mjs plan --dry-run --limit 50 2>&1 | head -40
              echo "tests-exit=$TE" >> ops/out/verify-verdict.txt
              grep -E '^# (tests|pass|fail) ' /tmp/tests.tap >> ops/out/verify-verdict.txt || true
              grep -E '^not ok' /tmp/tests.tap >> ops/out/verify-verdict.txt || true
            fi
            if [ "$MODE" = "grep" ]; then
              echo "=== GREP MODE ==="
              GF=$(sed -n '2p' ops/candidate/request.txt)
              GP=$(sed -n '3p' ops/candidate/request.txt)
              for F in $(echo "$GF" | tr '|' ' '); do
                echo "--- $F ---"
                grep -n -E -B3 -A70 "$GP" "$F" 2>&1 || echo "(no match)"
              done
            fi
            if [ "$MODE" = "reconcile" ]; then
              echo "=== RECONCILE MODE ==="
              node tools/writer-queue.mjs reconcile 2>&1; echo "EXIT=$?"
              echo "--- assignments after reconcile ---"
              node -e "const a=require('./docs/state/writer-assignments.json');console.log(a.active.batch_id, a.active.status, a.active.chunks.map(c=>c.seq+':'+c.status).join(' '))"
            fi
            if [ "$MODE" = "qa" ] && ls ops/candidate/bodies/*.body.html >/dev/null 2>&1; then
              echo "=== QA PIPELINE ==="
              mkdir -p ops/work/writers/writer-work ops/work/writers/data/blog/articles
              cp ops/candidate/bodies/*.body.html ops/work/writers/data/blog/articles/
              BATCH=$(node -e "console.log(require('./ops/candidate/chunk.json').batch_id)")
              WRITER=$(node -e "console.log(require('./ops/candidate/chunk.json').writer)")
              WDIR=${WRITER#writer_}
              SEQ=$(node -e "console.log(require('./ops/candidate/chunk.json').seq)")
              ID1=$(node -e "console.log(require('./ops/candidate/chunk.json').ids[0])")
              ID2=$(node -e "console.log(require('./ops/candidate/chunk.json').ids[1])")
              mkdir -p "ops/work/writers/writer-work/$BATCH/$WDIR"
              cp ops/candidate/chunk.json "ops/work/writers/writer-work/$BATCH/$WDIR/chunk-$(printf '%02d' $SEQ).json"
              echo "--- work view ---"
              find ops/work/writers/writer-work -type f | head -20
              echo "--- select-publish ---"
              node tools/writer-queue.mjs select-publish --work ops/work/writers || echo "SELECT_PUBLISH_FAILED"
              echo "--- stage ---"
              node tools/writer-queue.mjs stage "$BATCH" "$SEQ" --work ops/work/writers || echo "STAGE_FAILED"
              echo "--- article-qa $ID1 ---"
              node tools/article-qa.mjs "$ID1" || echo "QA_FAILED_$ID1"
              echo "--- article-qa $ID2 ---"
              node tools/article-qa.mjs "$ID2" || echo "QA_FAILED_$ID2"
              echo "--- verify-push ---"
              node tools/writer-queue.mjs verify-push "$BATCH" "$SEQ" --work ops/work/writers || echo "VERIFY_PUSH_FAILED"
            else
              if [ "$MODE" = "qa" ]; then echo "=== no candidate bodies, state dump only ==="; fi
            fi
            echo "=== END ==="
          } > ops/qa-result.txt 2>&1 || true
      - name: commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ops/qa-result.txt || true
          git add ops/out/ 2>/dev/null || true
          git add docs/state/writer-assignments.json 2>/dev/null || true
          MSG="ops: qa-runner result [skip ci]"
          if ! git diff --cached --quiet -- docs/state/writer-assignments.json 2>/dev/null; then
            BID=$(node -e "console.log(require('./docs/state/writer-assignments.json').active.batch_id)")
            TOT=$(node -e "console.log(require('./docs/state/writer-assignments.json').active.total)")
            NCH=$(node -e "console.log(require('./docs/state/writer-assignments.json').active.chunks.length)")
            MSG="writer-coordinator: plan $BID ($TOT ids, $NCH chunks) [skip ci]"
          fi
          git commit -m "$MSG" || echo "nothing"
          git pull --rebase
          git push

      - name: Surface diagnostic failures in Actions status
        if: always()
        run: |
          set -euo pipefail
          MODE="$(head -n 1 ops/candidate/request.txt 2>/dev/null || true)"
          case "$MODE" in
            verify-infra*)
              if grep -Eq '(writer-queue-validate-exit=[1-9]|blog-factory-validate-exit=[1-9]|tests-exit=[1-9]|TESTS_EXIT=[1-9])' ops/out/verify-verdict.txt; then
                echo "::error::Infrastructure diagnostic reported failures (see ops/out/verify-verdict.txt)"
                exit 1
              fi
              ;;
            plan*)
              if grep -Fq PLAN_FAILED ops/qa-result.txt; then
                echo "::error::Reservation plan failed (see ops/qa-result.txt)"
                exit 1
              fi
              ;;
            qa*|'')
              if grep -Eq 'QA_FAILED_|SELECT_PUBLISH_FAILED|STAGE_FAILED|VERIFY_PUSH_FAILED' ops/qa-result.txt; then
                echo "::error::Candidate QA/verification failed (see ops/qa-result.txt)"
                exit 1
              fi
              ;;
          esac
