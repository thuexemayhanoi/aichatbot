name: Image Ingest

# Carries raw AI source images (Figma MCP generate_image asset URLs, Canva
# export URLs) to the authoring session when its container cannot reach those
# hosts. The runner only DOWNLOADS allow-listed image URLs — no inference, no
# key — and parks the files on a transient branch image-ingest/run-<run_id>
# (a root commit holding only the images + manifest, never main). The session
# then runs `python3 tools/image-ingest.py pull <branch>` and the normal
# image-factory.py optimize → attach → qa → PR flow; pull deletes the branch.
on:
  workflow_dispatch:
    inputs:
      items:
        description: 'One "BA-XXXX https://…" pair per line (max 20)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: image-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/image-ingest.py
          sparse-checkout-cone-mode: false
      - name: Download allow-listed source images
        env:
          ITEMS: ${{ inputs.items }}
        run: printf '%s\n' "$ITEMS" | python3 tools/image-ingest.py fetch --out "$RUNNER_TEMP/ingest"
      - name: Park them on a transient branch
        env:
          BRANCH: image-ingest/run-${{ github.run_id }}
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/ingest"
          git init -q -b "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "image-ingest: raw source images (run $GITHUB_RUN_ID)"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          { echo "Branch: \`$BRANCH\`"; echo '```json'; cat manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
