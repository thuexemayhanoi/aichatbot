name: 'Writer Publisher (serialized)'

# v68 PARALLEL WRITER MODE (docs/PARALLEL-WRITER.md).
#
# The ONLY component allowed to push article content to main. Writers push
# bodies + chunk files to their own branches (writer/<batch>/<A|B|C>) and are
# never allowed to push main. This publisher:
#
#   1. extracts the writer-work view of ALL writer branches (global FIFO);
#   2. selects the next READY_TO_PUSH chunk — strict sequence order, exactly
#      ONE 2-article chunk at a time, never ahead of a lower sequence;
#   3. waits for the factory to be quiet (no derived-commit races);
#   4. stages the chunk (2 bodies + 2 manifest drafts) on FRESH main and
#      verifies it (batch ACTIVE, chunk READY_TO_PUSH, ids still PLANNED,
#      no manifest/body conflict, push scope EXACTLY 2 bodies + published.json);
#   5. pushes, dispatches blog-factory-publish with the EXACT 2 ids
#      (a GITHUB_TOKEN push cannot trigger workflows, so the factory run is
#      dispatched explicitly with article_ids);
#   6. on success marks the chunk PUBLISHED in the manifest; on failure marks
#      FACTORY_FAILED — the ids stay untouched for the REPAIR/BACKLOG pipeline.
#
# Concurrency group writer-publisher + cancel-in-progress false: publishers
# are strictly serialized. Chunk states RESERVED/READY_TO_PUSH make every
# step idempotent — a crashed run can be retried without double publishing.
# A push failure keeps the chunk RESERVED (retry-safe); a factory timeout
# also leaves it RESERVED with a recorded PUSH_FAILED event.
#
# §6G crash-window recovery: if a previous run already pushed the chunk
# to main but died before/while dispatching the factory (the 403 failure,
# run 37044896012), select-publish classifies the chunk and the run
# REQUEUES it instead of re-staging: the engine 'requeue' verifies/restores
# the exact 2 bodies + drafts from the writer branch, then the factory is
# dispatched with the same ids. A chunk whose matrix rows are already
# PUBLISHED content is never regenerated. A complete-only recovery still
# dispatches the factory to verify deployment before completing the manifest.
#
# workflow_dispatch recovery actions:
#   mark-published <batch> <seq>   complete after a manual factory re-run
#   mark-failed <batch> <seq>       terminal FAILED (owner decision)
#   mark-factory-failed <batch> <seq>
#   factory-requeue <ids>          dispatch blog-factory-publish with explicit ids

# RETIRED: external AI is the only writer. Historical trigger kept as comments for auditing.
# on:
#   push:
#     branches: ['writer/**']
#     paths: ['writer-work/**']
#   workflow_dispatch:
#     inputs:
#       action:
#         description: 'auto | mark-published | mark-failed | mark-factory-failed | factory-requeue'
#         required: false
#         default: 'auto'
#       batch:
#         description: 'WRITER-BATCH-xxxx (recovery actions)'
#         required: false
#         default: ''
#       seq:
#         description: 'chunk seq (recovery actions)'
#         required: false
#         default: ''
#       ids:
#         description: 'BA-ids cho factory-requeue (vd BA-0001,BA-0002)'
#         required: false
#         default: ''
on:
  push:
    branches: ['__retired_agent_do_not_use__']

permissions:
  contents: write
  # §6G fix (HTTP 403 "Resource not accessible by integration", publisher run
  # 37044896012): dispatching blog-factory-publish.yml and watching its run
  # (gh workflow run / gh run list / gh run watch) needs actions: write.
  actions: write

concurrency:
  group: writer-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ false }} # RETIRED (never execute legacy production)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # v70 ops gate: the publisher is the ONLY component that pushes article
      # content to main — it must refuse while an ops incident is active
      # (MAINTENANCE_LOCK && PRODUCTION_MUTATION = IMPOSSIBLE). Recovery
      # actions are production mutations too, so the gate covers the whole job.
      - name: 'Ops maintenance gate (incident/lock -> production paused)'
        run: |
          LOCKS=$(git ls-remote --refs origin 'refs/ops/maintenance-lock/*')
          if [ -n "$LOCKS" ]; then
            echo "::error::maintenance lock active — production paused"; exit 1
          fi
          node tools/ops-agent.mjs gate

      # ------------------------------------------------------------------
      # Recovery actions (manual, idempotent)
      # ------------------------------------------------------------------
      - name: 'Recovery action (manual dispatch)'
        id: recovery
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'auto' && github.event.inputs.action != ''
        run: |
          B="${{ github.event.inputs.batch }}"
          S="${{ github.event.inputs.seq }}"
          case "${{ github.event.inputs.action }}" in
            mark-published)        node tools/writer-queue.mjs complete "$B" "$S" ;;
            mark-failed)          node tools/writer-queue.mjs fail "$B" "$S" --state failed ;;
            mark-factory-failed)  node tools/writer-queue.mjs fail "$B" "$S" --state factory-failed ;;
            factory-requeue)
              IDS="${{ github.event.inputs.ids }}"
              if [ -z "$IDS" ]; then echo "::error::factory-requeue needs ids"; exit 1; fi
              gh workflow run blog-factory-publish.yml --ref main -f article_ids="$IDS"
              echo "factory re-queued for $IDS"
              ;;
            *) echo "::error::unknown action"; exit 1 ;;
          esac

      - name: 'Commit manifest changes from the recovery action'
        if: steps.recovery.outcome == 'success' && github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'auto' && github.event.inputs.action != 'factory-requeue' && github.event.inputs.action != ''
        run: |
          git config user.name "motoai-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add docs/state/writer-assignments.json
          if git diff --cached --quiet; then
            echo "no manifest change"
          else
            git commit -m "writer-publisher: recovery ${{ github.event.inputs.action }} ${{ github.event.inputs.batch }}#${{ github.event.inputs.seq }} [skip ci]"
            git push
          fi

      # ------------------------------------------------------------------
      # Auto path (writer branch push): global FIFO selection
      # ------------------------------------------------------------------
      - name: 'Collect ALL writer branches (global FIFO view)'
        if: github.event_name == 'push' || github.event.inputs.action == 'auto'
        run: |
          git fetch --prune origin 'refs/heads/writer/*:refs/remotes/origin/writer/*' || true
          mkdir -p /tmp/writers
          FOUND=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/writer); do
            echo "extracting $ref"
            git archive "$ref" writer-work 2>/dev/null | tar -x -C /tmp/writers || true
            git archive "$ref" data/blog/articles 2>/dev/null | tar -x -C /tmp/writers || true
            FOUND=1
          done
          echo "writer branches extracted: $FOUND"

      - name: 'Select the next READY_TO_PUSH chunk (strict FIFO, exactly one)'
        id: select
        if: github.event_name == 'push' || github.event.inputs.action == 'auto'
        run: |
          node tools/writer-queue.mjs select-publish --work /tmp/writers | tee /tmp/select.out
          get() { sed -n "s/^$1=//p" /tmp/select.out; }
          {
            echo "action=$(get action)"
            echo "mode=$(get mode)"
            echo "batch=$(get batch)"
            echo "seq=$(get seq)"
            echo "writer=$(get writer)"
            echo "ids=$(get ids)"
          } >> "$GITHUB_OUTPUT"
          echo "selection: action=$(get action) mode=$(get mode) batch=$(get batch) seq=$(get seq) ids=$(get ids)"

      - name: 'Stop when nothing is publishable'
        if: (github.event_name == 'push' || github.event.inputs.action == 'auto') && steps.select.outputs.action != 'publish' && steps.select.outputs.action != 'requeue'
        run: echo "nothing to publish (action=${{ steps.select.outputs.action }}) — FIFO stays strict"

      - name: 'Wait for factory quiet (avoid derived-commit races)'
        if: steps.select.outputs.action == 'publish' || steps.select.outputs.action == 'requeue'
        run: |
          for i in $(seq 1 60); do
            BUSY=$(gh run list --workflow blog-factory-publish.yml --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$BUSY" = "0" ]; then echo "factory quiet"; exit 0; fi
            echo "factory busy ($BUSY run(s)) — waiting 30s"
            sleep 30
          done
          echo "::error::factory still busy after 30 minutes"
          exit 1

      - name: 'Stage, verify and push the exact 2-article chunk (publish) — or requeue it (§6G)'
        if: steps.select.outputs.action == 'publish' || steps.select.outputs.action == 'requeue'
        id: push
        env:
          B: ${{ steps.select.outputs.batch }}
          S: ${{ steps.select.outputs.seq }}
          ACTION: ${{ steps.select.outputs.action }}
          IDS: ${{ steps.select.outputs.ids }}
        run: |
          EXPECTED_BODIES=$(node -e 'const ids=process.env.IDS.split(","); if(ids.length<1||ids.length>2||new Set(ids).size!==ids.length)process.exit(1); console.log(ids.length)')
          EXPECTED_TOTAL=$((EXPECTED_BODIES + 1))
          git config user.name "motoai-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            git clean -fd data/blog/articles || true
            if [ "$ACTION" = "requeue" ]; then
              # §6G: verify/restore the crash-window chunk from the writer
              # branch. Fails closed on any inconsistency; a legitimate
              # requeue may restore LESS than a full chunk (0-2 bodies and/or
              # the manifest) because the previous run already pushed it.
              node tools/writer-queue.mjs requeue "$B" "$S" --work /tmp/writers | tee /tmp/requeue.out
              git add data/blog/articles data/blog/published.json
              TOTAL=$(git diff --cached --name-only | wc -l | tr -d ' ')
              BODIES=$(git diff --cached --name-only | grep -c '^data/blog/articles/[^/]*\.body\.html$' || true)
              MANIFEST=$(git diff --cached --name-only | grep -c '^data/blog/published.json$' || true)
              OTHER=$(git diff --cached --name-only | grep -cv -e '^data/blog/articles/[^/]*\.body\.html$' -e '^data/blog/published.json$' || true)
              echo "requeue scope: total=$TOTAL bodies=$BODIES manifest=$MANIFEST other=$OTHER"
              if [ "$OTHER" != "0" ] || [ "$BODIES" -gt 2 ] || [ "$MANIFEST" -gt 1 ]; then
                echo "::error::bad requeue scope — at most 2 bodies + published.json allowed"
                exit 1
              fi
              if [ "$TOTAL" = "0" ]; then
                echo "nothing to restore — main already carries the crash-window content"
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -m "writer-publisher: requeue chunk $B#$S (§6G crash-window recovery) [skip ci]"
              if git push; then
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "requeue push failed (attempt $ATTEMPT) — refetching fresh main"
              continue
            fi
            node tools/writer-queue.mjs stage "$B" "$S" --work /tmp/writers
            node tools/writer-queue.mjs verify-push "$B" "$S" --work /tmp/writers
            git add data/blog/articles data/blog/published.json
            # HARD GUARD: the push scope is EXACTLY 2 bodies + published.json.
            TOTAL=$(git diff --cached --name-only | wc -l | tr -d ' ')
            BODIES=$(git diff --cached --name-only | grep -c '^data/blog/articles/[^/]*\.body\.html$' || true)
            MANIFEST=$(git diff --cached --name-only | grep -c '^data/blog/published.json$' || true)
            OTHER=$(git diff --cached --name-only | grep -cv -e '^data/blog/articles/[^/]*\.body\.html$' -e '^data/blog/published.json$' || true)
            echo "staged scope: total=$TOTAL bodies=$BODIES manifest=$MANIFEST other=$OTHER"
            if [ "$TOTAL" != "$EXPECTED_TOTAL" ] || [ "$BODIES" != "$EXPECTED_BODIES" ] || [ "$MANIFEST" != "1" ] || [ "$OTHER" != "0" ]; then
              echo "::error::bad push scope — exactly the assigned $EXPECTED_BODIES bodies + published.json required"
              exit 1
            fi
            git commit -m "writer-publisher: publish chunk $B#$S (2-article micro batch) [skip ci]"
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "pushed $(git rev-parse HEAD)"
              exit 0
            fi
            echo "push failed (attempt $ATTEMPT) — refetching fresh main"
          done
          echo "::error::cannot push after 3 attempts — chunk stays RESERVED (retry-safe)"
          exit 1

      - name: 'Run the factory for exactly this chunk'
        if: steps.select.outputs.action == 'publish' || steps.select.outputs.action == 'requeue'
        id: factory
        env:
          IDS: ${{ steps.select.outputs.ids }}
          SHA: ${{ steps.push.outputs.sha }}
          MODE: ${{ steps.select.outputs.mode }}
        run: |
          set -eo pipefail
          if [ "$MODE" = "complete-only" ]; then
            echo "complete-only: content checkpoint exists; verify Pages without rewriting articles"
          fi
          REQUEST_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_TITLE="Factory $IDS request $REQUEST_ID"
          gh workflow run blog-factory-publish.yml --ref main -f article_ids="$IDS" -f request_id="$REQUEST_ID"
          echo "factory dispatched for $IDS"
          RUN_ID=""
          for i in $(seq 1 12); do
            RUN_ID=$(gh run list --workflow blog-factory-publish.yml --event workflow_dispatch --limit 30 --json databaseId,displayTitle \
              | jq -r --arg wanted "$EXPECTED_TITLE" '[.[] | select(.displayTitle == $wanted)][0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::factory run not found — chunk stays RESERVED (retry-safe)"
            exit 1
          fi
          echo "watching factory run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if gh run watch "$RUN_ID" --exit-status > /dev/null 2>&1; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Mark the chunk PUBLISHED in the manifest (idempotent)'
        if: (steps.select.outputs.action == 'publish' || steps.select.outputs.action == 'requeue') && steps.factory.outputs.result == 'success'
        env:
          B: ${{ steps.select.outputs.batch }}
          S: ${{ steps.select.outputs.seq }}
        run: |
          set -e
          git config user.name "motoai-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            node tools/writer-queue.mjs complete "$B" "$S"
            git add docs/state/writer-assignments.json
            if git diff --cached --quiet; then
              echo "no manifest change (already completed)"
              exit 0
            fi
            git commit -m "writer-publisher: chunk $B#$S PUBLISHED [skip ci]"
            if git push; then exit 0; fi
            sleep 5
          done
          echo '::error::cannot checkpoint the completed chunk after three attempts'
          exit 1

      - name: 'Continue with one new writer job after a verified publication'
        if: (steps.select.outputs.action == 'publish' || steps.select.outputs.action == 'requeue') && steps.factory.outputs.result == 'success'
        run: |
          set -e
          git fetch origin main
          git checkout -B main origin/main
          LOCKS=$(git ls-remote --refs origin 'refs/ops/maintenance-lock/*')
          if [ -n "$LOCKS" ] || ! node tools/ops-agent.mjs gate; then
            echo 'production stopped — no continuation dispatch'
            exit 0
          fi
          gh workflow run auto-writer.yml --ref main -f dry_run=false
          echo 'one new bounded writer job dispatched; cron and watchdog remain recovery heartbeats'

      - name: 'Factory failed (mark FACTORY_FAILED, ids stay for the REPAIR pipeline)'
        if: (steps.select.outputs.action == 'publish' || steps.select.outputs.action == 'requeue') && steps.factory.outputs.result == 'failure'
        env:
          B: ${{ steps.select.outputs.batch }}
          S: ${{ steps.select.outputs.seq }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          node tools/writer-queue.mjs fail "$B" "$S" --state factory-failed --reason "factory run ${{ steps.factory.outputs.run_id }} failed"
          git config user.name "motoai-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add docs/state/writer-assignments.json
          if git diff --cached --quiet; then
            echo "no manifest change"
          else
            git commit -m "writer-publisher: chunk $B#$S FACTORY_FAILED [skip ci]"
            git push
          fi
          # v70 ops classification: a factory failure is either CONTENT QA
          # (ids stay in the REPAIR pipeline — never an ops incident) or an
          # INFRASTRUCTURE failure, which dispatches Agent #4 explicitly.
          # (GITHUB_TOKEN-dispatched runs may not fire workflow_run reliably,
          # so the publisher hands the failure over itself — docs/OPS-AGENTS.md.)
          FAILED_STEPS=$(gh api "repos/$GH_REPO/actions/runs/${{ steps.factory.outputs.run_id }}/jobs" \
            --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | join(";;")' 2>/dev/null || true)
          set +e
          node tools/ops-agent.mjs classify \
            --workflow 'Blog Factory Publish (2-article micro batch)' \
            --failed-steps "$FAILED_STEPS" > /tmp/classify.out
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            gh workflow run ops-repair-agent.yml --ref main \
              -f source_workflow='Blog Factory Publish (2-article micro batch)' \
              -f source_run_id="${{ steps.factory.outputs.run_id }}" \
              -f source_url="https://github.com/$GH_REPO/actions/runs/${{ steps.factory.outputs.run_id }}" \
              -f reason="factory infrastructure failure while publishing chunk $B#$S"
            echo "Agent #4 dispatched (infrastructure failure)"
          elif [ "$RC" -eq 3 ]; then
            echo "content QA failure — ids stay in the REPAIR pipeline, no ops incident"
          else
            cat /tmp/classify.out || true
            echo "::warning::ops classification unavailable (rc=$RC) — manual dispatch ops-repair-agent if needed"
          fi
