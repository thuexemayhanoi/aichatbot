name: SEO Audit & Monitoring (read-only)

# Independent of Blog Factory / external Writer. Never publish or modify content.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: seo-audit-monitor
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests for monitor
        run: node --test tests/unit/seo-live-monitor.test.js tests/unit/seo-index-coverage.test.js

      - name: Cold-start SEO research reports (ZERO-DATA until real Search Console data exists)
        if: always()
        run: |
          set -o pipefail
          node --test tests/unit/seo-cold-start.test.js
          # Reports depend on the live corpus: stale = warning (regenerate), not a red monitor.
          if ! node tools/seo-cold-start.mjs --check 2>&1 | tee seo-cold-start.txt; then
            echo "::warning::docs/seo/cold-start is stale (corpus or research changed) - run node tools/seo-cold-start.mjs and commit"
          fi

      - name: Matrix/sitemap publication coverage
        run: node tools/seo-index-coverage.mjs --json > seo-index-coverage.json

      - name: Offline site/indexability gate
        run: node tools/site-audit.mjs > seo-offline-audit.txt 2>&1

      - name: Deterministic static SEO score
        if: always()
        run: node tools/seo-score.mjs --json > seo-static-score.json

      - name: Live robots/sitemap/canonical/schema smoke
        if: always()
        run: node tools/seo-live-monitor.mjs --json > seo-live-monitor.json

      - name: Job summary
        if: always()
        run: |
          echo "## MotoAI SEO Audit & Monitoring" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Static audit: tools/site-audit.mjs and tools/seo-score.mjs" >> "$GITHUB_STEP_SUMMARY"
          echo "Live audit: tools/seo-live-monitor.mjs" >> "$GITHUB_STEP_SUMMARY"
          if test -s seo-index-coverage.json; then
            node -e 'const r=require("./seo-index-coverage.json"); console.log("Matrix published: "+r.counts.published+"; sitemap: "+r.counts.publishedInSitemap+"; other URLs: "+r.counts.otherSitemapUrls+"; gate: "+(r.pass?"PASS":"FAIL"))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s seo-live-monitor.json; then
            node -e 'const r=require("./seo-live-monitor.json"); console.log("Checks: "+r.passed+" PASS / "+r.failed+" FAIL; sitemap URLs: "+r.sitemapUrls+"; sampled HTML pages: "+r.sampledPages)' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s seo-cold-start.txt; then
            echo "Cold-start research: $(cat seo-cold-start.txt | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP crawlability is not evidence of actual Google/Bing indexing or Core Web Vitals field data." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motoai-seo-audit
          path: |
            seo-offline-audit.txt
            seo-static-score.json
            seo-live-monitor.json
            seo-index-coverage.json
            seo-cold-start.txt
          if-no-files-found: warn
          retention-days: 14
