name: NAP reconcile with live writer (temporary)

# Explicitly triggered once on the NAP PR branch. Never modify main, Writer,
# manifest or its source article bodies. Delete workflow before merge.
on:
  push:
    branches: ['seo/nap-bode-sync-20261013']
    paths: ['docs/nap-refresh-trigger.md']

permissions:
  contents: write

concurrency:
  group: nap-bode-branch-sync
  cancel-in-progress: false

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/nap-bode-sync-20261013
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge fresh Writer production history (no force or reset)
        run: |
          set -euo pipefail
          git fetch origin main
          echo "Latest main: $(git rev-parse origin/main)"
          echo "Branch before merge: $(git rev-parse HEAD)"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" merge --no-edit -X ours origin/main
      - name: Deterministically rebuild all pages and preserve matrix
        run: |
          set -euo pipefail
          node tools/build-blog.mjs
          git diff --exit-code -- data/blog/content-matrix.csv data/blog/published.json
          node --test tests/unit/data.test.js tests/unit/ui-brand.test.js tests/unit/global-menu.test.js
          node tools/site-audit.mjs
          node tools/seo-score.mjs --json > /tmp/seo-check.json
          node -e "const x=require('/tmp/seo-check.json'); if(!x.pass) process.exit(1); console.log('Static SEO score:',x.total)"
      - name: Commit derived static pages on NAP branch only
        run: |
          set -euo pipefail
          git add -A -- blog privacy terms gioi-thieu chinh-sach lien-he gia-thue data/blog/knowledge-index.json sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(nap): sync latest writer articles and regenerate NAP pages [skip ci]"
          fi
          git push origin HEAD:refs/heads/seo/nap-bode-sync-20261013
